[project]
name = "ComfyUI-Aaalice-Pack-Unpack-Tool"
description = """\
    A comprehensive toolkit for standardizing, packaging and deploying ComfyUI workflows \
    as reproducible environments and production-ready REST services. \
    Based on comfy-pack with custom modifications.
"""
authors = [{ name = "Aaalice233", email = "" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "bentoml>=1.3.21",
    "click>=8.1.7",
    "comfy-cli>=1.2.8",
]
dynamic = ["version"]

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/Aaalice233/ComfyUI-Aaalice-Pack-Unpack-Tool"

[project.scripts]
comfy-pack = "comfy_pack.cli:main"
comfy-unpack = "comfy_pack.unpacker_cli:main"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm.build]
includes = ["src/"]

[tool.pdm.version]
source = "scm"
